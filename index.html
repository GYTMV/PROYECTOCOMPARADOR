
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de archivos TXT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Comparador de archivos TXT</h2>

        <div class="archivos">
            <div>
                <label>Archivo 1</label>
                <input type="file" id="archivo1" accept=".txt">
            </div>

            <div>
                <label>Archivo 2</label>
                <input type="file" id="archivo2" accept=".txt">
            </div>
        </div>

        <button id="btnComparar">Comparar archivos</button>
        <button id="btnRefrescar" type="button">Refrescar</button>

        <div id="resultado"></div>

        <button id="btnDescargar" hidden>
            Descargar diferencias
        </button>
    </div>

    <script src="index.js"></script>
</body>
</html>
